spring:
  application:
    name: time-deposit
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/timedeposits}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        # Keep entity field names as column names, e.g. planType, timeDepositId.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        # Quote every name so Postgres keeps the camelCase names from the README.
        globally_quoted_identifiers: true
        jdbc:
          batch_size: 50
        order_updates: true
